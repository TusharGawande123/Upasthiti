[project]
name = "upasthiti-backend"
version = "0.1.0"
description = "Upasthiti – Smart Attendance backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "fastapi-cli>=0.0.32",
    "fpdf2>=2.8.9",
    "httpx2>=2.15.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "pypdfium2>=5.14.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "zxing-cpp>=3.1.1",
]
# Only for the hand-run load test (loadtest/, S-22); never installed in CI or the Docker image.
# Install with: uv sync --group loadtest
loadtest = [
    "locust>=2.46.7",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, N: naming, S: security
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM"]
# Database migrations are generated code; asserts are normal in tests.
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"], "migrations/**" = ["E501"] }

[tool.ruff.lint.flake8-bugbear]
# FastAPI reads Depends(...)/Query(...) in default arguments on purpose.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Body",
    "fastapi.Path", "fastapi.Header", "app.modules.auth.dependencies.require",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["app", "tests", "migrations"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=82"
markers = [
    "face_models: needs the downloaded face model files (skipped without them)",
]

[tool.coverage.run]
branch = true
