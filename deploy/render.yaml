# Render Blueprint for the Upasthiti backend (free plan, decisions 0002 and 0004).
# In Render: New → Blueprint → this repository → Blueprint file path "deploy/render.yaml".
# Secret values are never written here: Render asks for them ("sync: false") or makes one.
services:
  - type: web
    name: upasthiti-backend
    runtime: docker
    plan: free
    region: singapore # closest free region to Maharashtra
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true # every push to main deploys
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Free plan has no pre-deploy step: the container migrates before it starts.
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      # Proxies in front of the app: Vercel, Cloudflare (Render's edge) and Render's own two
      # entries. Measured on the live site on 2026-10-16 (decision 0007): 2 gave Cloudflare's
      # address, 3 gave Vercel's, 4 gives the real client.
      - key: TRUSTED_PROXY_HOPS
        value: "4"
      # Supabase connection pooler URL, session mode (port 5432). Typed in Render, never here.
      - key: DATABASE_URL
        sync: false
      # The website address, e.g. https://upasthiti.vercel.app
      - key: APP_PUBLIC_ORIGIN
        sync: false
      # Render creates a long random value once.
      - key: APP_SECRET_KEY
        generateValue: true
      # M2: QR cards and snapshots (decision 0008). Typed in Render, never written here.
      # Make the two keys on your laptop: uv run python -m app.scripts.make_qr_key and
      # uv run python -m app.scripts.make_snapshot_key. Keep copies in the password manager.
      - key: QR_SIGNING_KEY
        sync: false
      - key: SNAPSHOT_ENCRYPTION_KEY
        sync: false
      # Render's disk is wiped at every deploy, so snapshots go to Supabase Storage.
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      # Very powerful key: only here, never in the browser or the repository.
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # A PRIVATE bucket made in Supabase (keep the Data API switched off).
      - key: SNAPSHOT_BUCKET
        value: punch-snapshots
      # M3: face recognition (decision 0016). Typed in Render, never written here. Make the key
      # on your laptop: uv run python -m app.scripts.make_face_key. Keep a copy in the password
      # manager: if it is lost, every employee must be enrolled again. The backend does not
      # start in production without it.
      - key: FACE_TEMPLATE_KEY
        sync: false
      # The face model, chosen by measuring (docs/reports/M3-face-accuracy.md). The models are
      # baked into the image at build time. Changing the pack means everyone enrols again.
      - key: FACE_MODEL_PACK
        value: buffalo_s
