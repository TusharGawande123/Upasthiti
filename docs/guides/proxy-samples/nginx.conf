# Sample nginx reverse proxy for Upasthiti on the client's own server (M6, spec 7.5).
# Same job as the Caddyfile next to it: serve the built website, pass /api to the backend and set
# the security headers that Vercel sets today (frontend/vercel.json). Keep the header lists in sync;
# a test (backend/tests/test_m6_headers.py) compares them.
#
# Replace upasthiti.company.example, the certificate paths and /srv/upasthiti (the folder made by
# `npm run build`, frontend/dist). This file goes inside the `http { }` block, for example into
# /etc/nginx/conf.d/upasthiti.conf.
#
# Backend settings for this layout: ONE proxy in front, so TRUSTED_PROXY_HOPS=1 (or set
# CLIENT_IP_HEADER=X-Real-IP, which this file overwrites with the connecting address).
# After every change: log in once and compare the IP in the audit log with your computer's address.

# nginx does not inherit add_header into a location that has its own add_header, so every location
# below repeats the base headers. Keep the word `always`: it also sets them on error pages.

upstream upasthiti_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name upasthiti.company.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name upasthiti.company.example;

    ssl_certificate     /etc/ssl/upasthiti/fullchain.pem;
    ssl_certificate_key /etc/ssl/upasthiti/privkey.pem;

    server_tokens off;
    root /srv/upasthiti;
    index index.html;
    # Photos are small; the backend has its own body limits.
    client_max_body_size 10m;

    # --- On every response ---------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # --- The API: never kept by a browser or a proxy --------------------------------------
    location /api/ {
        proxy_pass http://upasthiti_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITE what the caller sent ($remote_addr), never append to it (the "add" variable):
        # the caller's own entries would otherwise decide which IP the backend limits and logs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
        add_header Cache-Control "no-store" always;
    }

    # --- The gate screen: strict CSP ---------------------------------------------------------
    location ~ ^/attendance(/.*)?$ {
        try_files /index.html =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # --- The employee phone pages: the same CSP, passkeys allowed ----------------------------
    location ~ ^/phone(/.*)?$ {
        try_files /index.html =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), publickey-credentials-get=(self), publickey-credentials-create=(self), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # --- The gate's service worker and the version file: never cached for long ---------------
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/attendance" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    location = /version.json {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # --- Everything else is the website (one page app) ---------------------------------------
    location / {
        try_files $uri /index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    }
}
