<!doctype html>
<!--
  Upasthiti – M1 design gate D – Screen D5: Approvals inbox (/admin/approvals, Super Admin) and My requests (Corporate Head).
  Super Admin states (join with "+"): (none) Waiting list · #history (all statuses) · detail drawers: #edit · #transfer ·
  #bulk · #import · #import-flagged (a row no longer passes) · #create (approved) · #rejected · #withdrawn · #failed ·
  dialogs: #reject · #reject-error · progress: #approving · #approve-failed · toast: #approved · other: #empty · #loading · #error.
  Corporate Head "My requests": #mine+ch (list) · #mine-empty+ch · #mine-detail+ch (rejected, with reason) · #withdraw+ch (confirm) ·
  #mine-failed+ch (drawer for a request that could not be applied) · #mine-loading+ch.
  Phone check: open at 390 px width (cards, and the drawer becomes a full screen). MOCKUP ONLY – static HTML, fake data.
-->
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upasthiti Approvals</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../gate-a/tokens.css" />
  <link rel="stylesheet" href="../gate-a/shell.css" />
  <link rel="stylesheet" href="../gate-bc/bc.css" />
  <link rel="stylesheet" href="d.css" />
</head>
<body data-active="approvals">
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <main class="page" id="page"></main>
  </div>
</div>
<script src="../gate-a/shell.js"></script>
<script src="d.js"></script>
<script src="d-extra.js"></script>
<script>
  const isMine = D.has("mine") || D.has("mine-empty") || D.has("mine-detail") || D.has("withdraw") || D.has("mine-failed") || D.has("mine-loading");
  if (isMine && D.role === "sa") { D.role = "ch"; D.roleName = "Corporate Head"; }

  // ---------- fake requests (invented) ----------
  const R = {
    edit: { kind: "edit", status: "pending", summary: "Edit <b>Pradeep Jadhav</b> (1042): overtime rate, department", plants: ["K134"], by: "Vikram Deshmukh", when: "14/10/2026 11:20", reason: "New wage agreement from October. He now works in Quality checks on press line B." },
    transfer: { kind: "transfer", status: "pending", summary: "Move <b>Pooja Wagh</b> (2063) from PC2 to SPI, from 19/10/2026", plants: ["PC2", "SPI"], by: "Neha Kulkarni", when: "14/10/2026 10:42", reason: "SPI needs a packing helper for the festival rush." },
    bulk: { kind: "bulk", status: "pending", summary: "Move <b>24 people</b> at TP1 to the Night shift", plants: ["TP1"], by: "Neha Kulkarni", when: "14/10/2026 09:58", reason: "Fabrication line 2 runs at night from 19/10." },
    import: { kind: "import", status: "pending", summary: "Import <b>120 employees</b> from TP2-opening-staff.xlsx", plants: ["TP2"], by: "Neha Kulkarni", when: "13/10/2026 17:30", reason: "Opening crew of the new Tirupati Pressco Unit 2." },
    create: { kind: "create", status: "approved", summary: "Add <b>Nitin Warade</b> (2110) at X280", plants: ["X280"], by: "Vikram Deshmukh", when: "13/10/2026 14:05", decided: "Approved by Asha Rao on 13/10/2026 at 15:20", reason: "New CNC operator, joined today." },
    approvedTransfer: { kind: "transfer", status: "approved", summary: "Move <b>Sagar Pawar</b> (2042) from TP1 to K134, from 20/10/2026", plants: ["TP1", "K134"], by: "Neha Kulkarni", when: "14/10/2026 08:50", decided: "Approved by Asha Rao on 14/10/2026 at 10:42" },
    rejected: { kind: "edit", status: "rejected", summary: "Edit <b>Kavita More</b> (1055): overtime rate", plants: ["X280"], by: "Vikram Deshmukh", when: "12/10/2026 11:00", decided: "Rejected by Asha Rao on 12/10/2026 at 12:15", why: "₹260 per hour looks like a typing mistake. Please check the rate and send it again.", reason: "Rate revision." },
    withdrawn: { kind: "create", status: "withdrawn", summary: "Add <b>Rohit Gaikwad</b> (2111) at TP1", plants: ["TP1"], by: "Neha Kulkarni", when: "11/10/2026 16:40", decided: "Withdrawn by Neha Kulkarni on 11/10/2026 at 17:05", reason: "Joining date not final." },
    failed: { kind: "bulk", status: "failed", summary: "Move <b>3 people</b> at SPI to the Night shift", plants: ["SPI"], by: "Vikram Deshmukh", when: "11/10/2026 10:30", decided: "Tried by Asha Rao on 12/10/2026 at 09:25", why: "Shift \"Night\" is no longer active at SPI.", reason: "Press line trial." },
  };
  const PENDING = [R.edit, R.transfer, R.bulk, R.import];
  const HISTORY = [R.approvedTransfer, R.create, R.rejected, R.failed, R.withdrawn];

  const plantCell = function (r) { return r.plants.length === 2 ? '<b class="code">' + r.plants[0] + "</b> " + D.icon("arrow-right", 13, "color:var(--subtle-foreground);vertical-align:-2px") + ' <b class="code">' + r.plants[1] + "</b>" : '<b class="code">' + r.plants[0] + "</b>"; };

  function requestRows(list, o) {
    return list.map(function (r, i) {
      const sel = o.selected === r;
      const key = Object.keys(R).filter(function (k) { return R[k] === r; })[0];
      return '<tr class="' + (sel ? "sel-row " : "") + '" style="cursor:pointer" data-key="' + key + '">' +
        '<td data-label="Kind">' + D.kindBadge(r.kind) + "</td>" +
        '<td class="full"><div style="white-space:normal;max-width:430px;line-height:1.4">' + r.summary + (r.why && o.showWhy ? '<div class="why">' + D.icon(r.status === "failed" ? "triangle-alert" : "message-square-warning", 14) + "<span>" + (r.status === "failed" ? "Could not apply: " : "Reason: ") + r.why + "</span></div>" : "") + "</div></td>" +
        '<td data-label="Plant">' + plantCell(r) + "</td>" +
        (o.mine ? "" : '<td data-label="Requested by"><div class="emp-name"><span class="avatar" style="width:30px;height:30px;font-size:11px">' + D.initials(r.by) + "</span><span>" + r.by + "</span></div></td>") +
        '<td data-label="Sent" class="tnum">' + r.when.replace(" ", "<br>") + "</td>" +
        '<td data-label="Status">' + D.reqStatus(r.status) + "</td>" +
        (o.mine ? '<td class="hide-m"><div class="row-actions">' + (r.status === "pending" ? '<button class="btn btn-outline btn-sm">' + D.icon("undo-2", 15) + "Withdraw</button>" : (r.status === "rejected" || r.status === "failed") ? '<a class="btn btn-outline btn-sm" href="#">' + D.icon("pencil", 15) + "Fix and send again</a>" : "") + "</div></td>" : '<td class="hide-m" style="width:40px">' + D.icon("chevron-right", 18, "color:var(--subtle-foreground)") + "</td>") +
        "</tr>";
    }).join("");
  }
  function requestTable(list, o) {
    return '<div style="overflow-x:auto"><table class="table rt emp"><thead><tr><th scope="col">Kind</th><th scope="col">What is asked</th><th scope="col">Plant</th>' + (o.mine ? "" : '<th scope="col">Requested by</th>') + '<th scope="col">Sent (IST)</th><th scope="col">Status</th><th scope="col"><span class="sr-only">' + (o.mine ? "Actions" : "Open") + "</span></th></tr></thead><tbody>" + requestRows(list, o) + "</tbody></table></div>";
  }
  const skeleton = function (n) { return '<div style="overflow-x:auto"><table class="table"><thead><tr><th>Kind</th><th>What is asked</th><th>Plant</th><th>Requested by</th><th>Sent</th><th>Status</th><th></th></tr></thead><tbody aria-busy="true">' + new Array(n + 1).join("<tr>" + [110, 330, 50, 130, 80, 90, 14].map(function (w) { return '<td><div class="skeleton" style="height:16px;width:' + w + 'px"></div></td>'; }).join("") + "</tr>") + "</tbody></table></div>"; };

  function filters(history) {
    return '<div class="toolbar"><button class="btn btn-outline f-desk" style="height:38px"><span class="muted" style="font-weight:500">Kind</span><b>Any</b>' + D.icon("chevron-down", 15, "color:var(--muted-foreground)") + '</button>' +
      '<button class="btn btn-outline f-desk" style="height:38px"><span class="muted" style="font-weight:500">Plant</span><b>Any</b>' + D.icon("chevron-down", 15, "color:var(--muted-foreground)") + "</button>" +
      (history ? '<button class="btn btn-outline f-desk" style="height:38px"><span class="muted" style="font-weight:500">Status</span><b>Any</b>' + D.icon("chevron-down", 15, "color:var(--muted-foreground)") + "</button>" : "") +
      '<button class="btn btn-outline mobile-only" style="height:42px">' + D.icon("sliders-horizontal", 16) + "Filters</button></div>";
  }

  // ---------- drawer ----------
  function drawerFor(key) {
    const r = R[key];
    const people = function (rows, more) {
      return '<div class="mini-wrap"><table class="mini-table"><thead><tr><th>Code</th><th>Name</th><th>Now</th><th>After</th></tr></thead><tbody>' + rows.map(function (x) { return '<tr><td class="code"><b>' + x[0] + "</b></td><td>" + x[1] + '</td><td class="muted">' + x[2] + "</td><td><b>" + x[3] + "</b></td></tr>"; }).join("") + (more ? '<tr><td colspan="4" class="muted" style="text-align:center">+ ' + more + " more people, same change</td></tr>" : "") + "</tbody></table></div>";
    };
    let changes = "";
    if (key === "edit") changes = '<div class="diff">' + D.fieldChange("Overtime rate", "₹185/h", "₹195/h") + D.fieldChange("Department", "Press shop", "Quality") + "</div>";
    if (key === "transfer") changes = '<div class="diff">' + D.fieldChange("Plant", "PC2 · Precise Cuts, Unit 2", "SPI · Siddharth Pressings") + D.fieldChange("Shift", "General 07:00–19:00 (PC2)", "General 07:00–19:00 (SPI)") + D.newValue("Effective from", "19/10/2026 (in 5 days)") + '<div class="diff-row"><div class="diff-field">Kept the same</div><div class="muted" style="font-size:13.5px;margin-top:4px">Category Helper · Department Packing</div></div></div>';
    if (key === "bulk") changes = '<div class="diff">' + D.fieldChange("Shift (24 people)", "General 07:00–19:00", "Night 19:00–07:00 (ends next day)") + '<div class="diff-row"><div class="diff-field">Starts on</div><div style="margin-top:4px">19/10/2026</div></div></div><div class="label" style="margin:16px 0 8px">People in this change <span class="muted" style="font-weight:500">(first 5 of 24)</span></div>' +
      people([["2041", "Ravi Patil", "General", "Night"], ["2042", "Sagar Pawar", "General", "Night"], ["2071", "Santosh Chavan", "General", "Night"], ["2094", "Amol Dange", "General", "Night"], ["2118", "Kiran Bodke", "General", "Night"]], 19);
    if (key === "create") changes = '<div class="diff">' + D.newValue("Employee code", '<span class="code">2110</span>') + D.newValue("Full name", "Nitin Warade") + D.newValue("Type", "Permanent · marks with face") + D.newValue("Plant, category, shift", "X280 · Operator · General 07:00–19:00") + D.newValue("Overtime rate", "₹175/h") + "</div>";
    if (key === "import") {
      const flagged = D.has("import-flagged");
      changes = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px"><div class="result-tile rt-neutral"><div><b class="big tnum">120</b><span class="muted">rows in the file</span></div></div><div class="result-tile ' + (flagged ? "rt-bad" : "rt-ok") + '"><div><b class="big tnum">' + (flagged ? "1" : "0") + "</b><span>" + (flagged ? "row no longer passes" : "rows with errors") + "</span></div></div></div>" +
        (flagged ? '<div class="alert alert-danger" role="alert" style="margin-bottom:14px">' + D.icon("circle-alert", 20) + "<div><b>Row 87 no longer passes the checks.</b><div>Code 2310 was added by someone else after this was sent. An import is all-or-nothing, so approving now would fail for all 120. <span class=\"err-code code\">EMPLOYEE_CODE_EXISTS</span></div></div></div>" : '<div class="alert alert-success" style="margin-bottom:14px">' + D.icon("circle-check", 20) + "<div>All 120 rows passed the checks when this was sent. They are checked again when you approve.</div></div>") +
        '<div class="label" style="margin:0 0 8px">Rows in the file <span class="muted" style="font-weight:500">(first rows shown)</span></div><div class="mini-wrap"><table class="mini-table"><thead><tr><th>Row</th><th>Code</th><th>Name</th><th>Type</th><th>Plant</th></tr></thead><tbody>' +
        [[2, "3001", "Aarti Kharat", "Permanent", "TP2"], [3, "3002", "Balaji Rathod", "Temporary", "TP2"], [4, "3003", "Chetan Pardeshi", "Temporary", "TP2"], [5, "3004", "Deepali Shirke", "Permanent", "TP2"]].map(function (x) { return '<tr><td class="tnum">' + x[0] + '</td><td class="code"><b>' + x[1] + "</b></td><td>" + x[2] + "</td><td>" + x[3] + "</td><td><b class=\"code\">" + x[4] + "</b></td></tr>"; }).join("") +
        (flagged ? '<tr class="row-bad"><td class="tnum">87</td><td class="code"><b>2310</b></td><td>Mohan Sonawane</td><td>Temporary</td><td><span class="err-code code">EMPLOYEE_CODE_EXISTS</span></td></tr>' : '<tr><td colspan="5" class="muted" style="text-align:center">+ 116 more rows</td></tr>') + "</tbody></table></div>";
    }
    if (key === "rejected" || key === "withdrawn" || key === "failed") {
      if (key === "rejected") changes = '<div class="diff">' + D.fieldChange("Overtime rate", "₹160/h", "₹260/h") + "</div>";
      if (key === "withdrawn") changes = '<div class="diff">' + D.newValue("Employee code", '<span class="code">2111</span>') + D.newValue("Full name", "Rohit Gaikwad") + D.newValue("Plant, category", "TP1 · Helper") + "</div>";
      if (key === "failed") changes = '<div class="diff">' + D.fieldChange("Shift (3 people)", "General 07:00–19:00", "Night 19:00–07:00") + "</div>";
    }
    return { r: r, changes: changes };
  }

  function drawer(key, o) {
    o = o || {};
    const d = drawerFor(key);
    const r = d.r;
    const mine = D.role === "ch";
    const title = { edit: "Edit Pradeep Jadhav (1042)", transfer: "Move Pooja Wagh (2063) to SPI", bulk: "Move 24 people to the Night shift", import: "Import 120 employees", create: "Add Nitin Warade (2110)", rejected: "Edit Kavita More (1055)", withdrawn: "Add Rohit Gaikwad (2111)", failed: "Move 3 people to the Night shift" }[key];
    let status = D.reqStatus(r.status);
    let alerts = "";
    if (r.status === "pending" && !o.approveFailed) alerts += '<div class="alert alert-info" style="margin-bottom:16px">' + D.icon("shield-check", 20) + "<div>" + (mine ? "<b>Waiting for the Super Admin.</b> Nothing has changed yet. You can withdraw it while it waits." : "<b>Nothing has changed yet.</b> Approving applies the change at once. The audit log records both of you.") + "</div></div>";
    if (o.approveFailed) { status = D.reqStatus("failed"); alerts += '<div class="alert alert-danger anim-shake" role="alert" style="margin-bottom:16px">' + D.icon("circle-alert", 20) + "<div><b>This change can no longer be applied.</b><div>Department \"Quality\" is not active at K134 any more. Nothing was changed. <span class=\"err-code code\">REQUEST_CHECK_FAILED</span></div><div style=\"margin-top:6px\">The request is closed. Vikram Deshmukh can see the reason and send a corrected one.</div></div></div>"; }
    if (r.status === "rejected") alerts += '<div class="alert alert-danger" role="note" style="margin-bottom:16px">' + D.icon("circle-x", 20) + "<div><b>Rejected.</b> " + r.decided + '<div style="margin-top:4px"><b>Reason:</b> ' + r.why + "</div></div></div>";
    if (r.status === "failed") alerts += '<div class="alert alert-danger" role="alert" style="margin-bottom:16px">' + D.icon("triangle-alert", 20) + "<div><b>Could not apply.</b> " + r.decided + '. Nothing was changed.<div style="margin-top:4px"><b>Reason:</b> ' + r.why + ' <span class="err-code code">REQUEST_CHECK_FAILED</span></div></div></div>';
    if (r.status === "approved") alerts += '<div class="alert alert-success" role="note" style="margin-bottom:16px">' + D.icon("circle-check", 20) + "<div><b>Approved and applied.</b> " + r.decided + ".</div></div>";
    if (r.status === "withdrawn") alerts += '<div class="alert" role="note" style="margin-bottom:16px;background:var(--muted);border-color:var(--border);color:var(--muted-foreground)">' + D.icon("undo-2", 20) + "<div><b>Withdrawn.</b> " + r.decided + ". Nothing was changed.</div></div>";

    let foot;
    if (o.approveFailed) foot = '<button class="btn btn-outline btn-lg">Close</button>';
    else if (r.status === "pending" && !mine) foot = '<button class="btn btn-danger-outline btn-lg">' + D.icon("circle-x", 18) + "Reject…</button><span class=\"spacer-grow\"></span>" + '<button class="btn btn-primary btn-lg"' + (o.approving ? ' aria-busy="true"' : "") + (D.has("import-flagged") ? ' title="Fails the re-check"' : "") + ">" + (o.approving ? D.spinner + "Approving…" : D.icon("check", 18) + (key === "import" ? "Approve and import 120" : "Approve")) + "</button>";
    else if (r.status === "pending" && mine) foot = '<button class="btn btn-outline btn-lg">Close</button><span class="spacer-grow"></span><button class="btn btn-danger-outline btn-lg">' + D.icon("undo-2", 18) + "Withdraw</button>";
    else foot = '<button class="btn btn-outline btn-lg">Close</button>' + ((mine && (r.status === "rejected" || r.status === "failed")) ? '<span class="spacer-grow"></span><a class="btn btn-primary btn-lg" href="#">' + D.icon("pencil", 18) + "Fix and send again</a>" : "");

    return '<div class="overlay" style="z-index:44"></div><aside class="sheet anim-sheet-in" role="dialog" aria-modal="true" aria-labelledby="dr-title" style="z-index:50;width:min(560px,100vw)">' +
      '<div class="sheet-head"><span class="kind" style="flex:none"><i data-lucide="' + D.KINDS[r.kind].icon + '" style="width:40px;height:40px;padding:10px;border-radius:12px"></i></span><div style="flex:1;min-width:0"><div class="muted" style="font-size:12.5px;font-weight:600">' + D.KINDS[r.kind].label + '</div><h2 id="dr-title" style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.01em">' + title + '</h2><div style="margin-top:8px">' + status + '</div></div><button class="btn btn-ghost btn-icon btn-sm" aria-label="Close details">' + D.icon("x", 18) + "</button></div>" +
      '<div class="sheet-body">' + alerts +
      '<dl class="kv" style="margin:0 0 18px"><dt>Asked by</dt><dd><span class="emp-name"><span class="avatar" style="width:28px;height:28px;font-size:11px">' + D.initials(r.by) + "</span>" + r.by + ' <span class="muted" style="font-weight:400">· Corporate Head</span></span></dd><dt>Sent</dt><dd class="tnum">' + r.when + " IST</dd><dt>Plant</dt><dd>" + plantCell(r) + "</dd></dl>" +
      (r.reason ? '<div class="label">Why they asked</div><div class="tl-note" style="margin:0 0 18px">' + r.reason + "</div>" : "") +
      '<div class="label" style="display:flex;align-items:center;gap:8px">' + (key === "import" ? "What would be created" : "What changes") + (r.status === "pending" ? '<span class="tab-note" style="margin-left:auto">Before and after</span>' : "") + "</div>" + d.changes + "</div>" +
      '<div class="sheet-foot">' + foot + "</div></aside>";
  }

  function rejectDialog(withError) {
    return D.dialog({ icon: "circle-x", tone: "di-danger", title: "Reject this request", desc: "Edit Pradeep Jadhav (1042), asked by Vikram Deshmukh. Nothing will change. He sees your reason.", width: 540,
      body: D.field({ id: "rj", label: "Reason", req: true, control: '<textarea id="rj" class="input textarea"' + (withError ? ' aria-invalid="true" aria-describedby="rj-err"' : "") + ' placeholder="Tell them what to fix, so the next request is right">' + (withError ? "" : "The OT rate must match the new wage agreement. Please attach the circular number.") + "</textarea>", error: withError ? "Write a reason. The Corporate Head needs it to fix the request." : "" }),
      foot: '<button class="btn btn-outline btn-lg">Cancel</button><button class="btn btn-lg" style="background:var(--danger);color:#fff">' + D.icon("circle-x", 16) + "Reject request</button>" });
  }

  function render() {
    const page = document.getElementById("page");
    const mine = D.role === "ch";
    const history = D.has("history");

    if (mine) {
      const head = D.pageHead({ title: "My requests", desc: "Changes you sent to the Super Admin. Nothing takes effect until it is approved.", actions: '<a class="btn btn-primary btn-lg" href="D2-employee-form.html#ch">' + D.icon("plus", 18) + "Add employee</a>" });
      let body;
      const mineList = [R.edit, R.create, R.rejected, R.failed];
      if (D.has("mine-loading")) body = skeleton(5);
      else if (D.has("mine-empty")) body = '<div class="empty"><div class="empty-icon">' + D.icon("send") + "</div><h2>You have not sent any requests</h2><p>When you add, edit, transfer or import employees, the request appears here with its status.</p><div class=\"flex justify-center gap-2\" style=\"margin-top:20px\"><a class=\"btn btn-primary btn-lg\" href=\"D2-employee-form.html#ch\">" + D.icon("plus", 18) + "Add employee</a><a class=\"btn btn-outline btn-lg\" href=\"D6-import.html#ch\">" + D.icon("file-spreadsheet", 18) + "Import from Excel</a></div></div>";
      else body = requestTable(mineList, { mine: true, showWhy: true });
      const tabs = '<div class="tabs" role="tablist" aria-label="Request status" style="margin:0 0 16px"><a class="tab" role="tab" href="#mine+ch" aria-selected="true">' + D.icon("list") + 'All<span class="tab-count tnum">' + (D.has("mine-empty") ? 0 : 4) + '</span></a><a class="tab" role="tab" href="#" aria-selected="false">' + D.icon("hourglass") + 'Waiting<span class="tab-count tnum">1</span></a><a class="tab" role="tab" href="#" aria-selected="false">' + D.icon("triangle-alert") + 'Need your attention<span class="tab-count tnum">2</span></a></div>';
      page.innerHTML = head + tabs + '<div class="card anim-fade-up anim-delay-1" style="overflow:hidden">' + body + "</div>";
      return;
    }

    const head = D.pageHead({ title: "Approvals", desc: "Changes the Corporate Head sent. Check each one, then approve or reject. Nothing is applied before you approve.", actions: '<span class="badge badge-neutral" title="Only the Super Admin can approve">' + D.icon("shield-check") + "Super Admin only</span>" });
    const tabs = '<div class="tabs" role="tablist" aria-label="Approvals" style="margin:0 0 16px"><a class="tab" role="tab" href="#" aria-selected="' + !history + '">' + D.icon("hourglass") + 'Waiting<span class="tab-count tnum">' + (D.has("empty") ? 0 : 4) + '</span></a><a class="tab" role="tab" href="#history" aria-selected="' + history + '">' + D.icon("history") + 'History<span class="tab-count tnum">5</span></a></div>';

    let body;
    if (D.has("loading")) body = filters(history) + skeleton(5);
    else if (D.has("error")) body = '<div style="padding:48px 20px"><div class="alert alert-danger" role="alert" style="max-width:560px;margin:0 auto">' + D.icon("circle-alert", 20) + '<div style="flex:1"><b>Could not load the requests.</b><div>Check the internet connection and try again. Nothing was changed.</div></div><button class="btn btn-outline btn-sm">' + D.icon("rotate-cw", 15) + "Try again</button></div></div>";
    else if (D.has("empty")) body = '<div class="empty" style="padding:64px 24px 60px"><div class="done-ring dr-success" style="width:80px;height:80px;position:relative">' + D.icon("circle-check") + "</div><h2>Nothing to approve</h2><p>All requests are done. When the Corporate Head sends a change, it appears here and the number shows on Approvals in the menu.</p></div>";
    else {
      const sel = D.has("edit") ? R.edit : D.has("transfer") ? R.transfer : D.has("bulk") ? R.bulk : (D.has("import") || D.has("import-flagged")) ? R.import : null;
      body = filters(history) + requestTable(history ? HISTORY : PENDING, { selected: sel, showWhy: history });
    }
    const foot = (D.has("loading") || D.has("error") || D.has("empty")) ? "" : '<div class="table-foot"><span class="tnum">' + (history ? "Showing 5 of 5 decided requests" : "Showing 4 waiting requests") + "</span><span>Oldest waiting: 13/10/2026</span></div>";
    page.innerHTML = head + tabs + '<div class="card anim-fade-up anim-delay-1" style="overflow:hidden">' + body + foot + "</div>";
  }

  function overlays() {
    const keys = ["edit", "transfer", "bulk", "import", "import-flagged", "create", "rejected", "withdrawn", "failed"];
    let key = keys.filter(D.has)[0];
    if (D.has("reject") || D.has("reject-error") || D.has("approving") || D.has("approve-failed") || D.has("approved")) key = key || "edit";
    if (D.has("mine-detail")) key = "rejected";
    if (D.has("mine-failed")) key = "failed";
    if (D.has("withdraw")) key = "edit";
    if (key === "import-flagged") key = "import";
    if (D.has("approved")) { D.toast("Approved. Pradeep Jadhav's overtime rate and department were changed.", "Open employee"); return; }
    if (key && !D.has("approved")) D.mount(drawer(key, { approving: D.has("approving"), approveFailed: D.has("approve-failed") }));
    if (D.has("reject") || D.has("reject-error")) D.mount(rejectDialog(D.has("reject-error")));
    if (D.has("withdraw")) D.mount(D.dialog({ icon: "undo-2", tone: "di-warning", alert: true, title: "Withdraw this request?", width: 500, desc: "Edit Pradeep Jadhav (1042). The Super Admin will not see it any more.",
      body: '<p style="margin:0">Nothing has changed for Pradeep Jadhav. You can send a new request later.</p>', foot: '<button class="btn btn-outline btn-lg">Keep waiting</button><button class="btn btn-primary btn-lg">' + D.icon("undo-2", 16) + "Withdraw request</button>" }));
    if (D.has("reject") || D.has("reject-error")) { const ov = document.querySelectorAll(".overlay"); if (ov.length > 1) ov[1].style.zIndex = 46; document.querySelector(".dialog").style.zIndex = 55; }
  }

  window.onMockState = function () {
    if (isMine && D.role === "sa") { D.role = "ch"; }
    D.patchShell();
    if (D.role === "ch") {
      const nav = document.querySelector('.sb-item[aria-current="page"] .sb-label');
      if (nav) nav.textContent = "My requests";
    }
    render();
    overlays();
    const titles = { history: "History tab", edit: "detail: edit", transfer: "detail: transfer", bulk: "detail: bulk change", import: "detail: import", "import-flagged": "detail: import with a row that no longer passes", create: "detail: approved new employee", rejected: "detail: rejected", withdrawn: "detail: withdrawn", failed: "detail: could not apply", reject: "reject dialog", "reject-error": "reject dialog, reason missing", approving: "approving…", "approve-failed": "approval re-check failed", approved: "approved toast", empty: "nothing to approve", loading: "loading", error: "could not load", mine: "My requests", "mine-empty": "My requests, empty", "mine-detail": "My requests: rejected, with reason", withdraw: "withdraw confirm", "mine-failed": "My requests: could not apply", "mine-loading": "My requests, loading" };
    const key = Object.keys(titles).filter(D.has)[0];
    D.tag((key ? titles[key] : "Waiting list") + " · " + D.roleName);
  };
</script>
<style>
  .why { display: flex; gap: 6px; align-items: flex-start; margin-top: 4px; font-size: 13px; color: var(--danger); font-weight: 500; }
  .why svg { flex: none; margin-top: 2px; }
  .rt td .why span { white-space: normal; }
  @media (max-width: 640px) { .sheet { width: 100vw !important; } .sheet-foot { flex-wrap: wrap; } .sheet-foot .btn { flex: 1; } }
</style>
</body>
</html>
