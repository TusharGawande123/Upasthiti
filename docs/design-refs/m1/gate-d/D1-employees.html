<!doctype html>
<!--
  Upasthiti – M1 design gate D – Screen D1: Employees list (/admin/employees) with bulk actions.
  States (URL hash, join with "+"): (none) Super Admin, Active tab · #loading · #empty · #no-match · #error ·
  #left (Left tab) · #selected (3 selected, bulk bar) · #toomany (648 selected, over the 500 limit) ·
  #columns (column chooser) · #filter-contractor (filter popover) · #bulk-shift · #bulk-mixed (people from
  several plants) · #bulk-ot · #bulk-category · #bulk-left (Super Admin) · roles: +ch Corporate Head (bar says "Send for approval") · +ph Plant Head (read-only).
  Phone check: open at 390 px width. MOCKUP ONLY – static HTML, fake data.
-->
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upasthiti Employees</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../gate-a/tokens.css" />
  <link rel="stylesheet" href="../gate-a/shell.css" />
  <link rel="stylesheet" href="../gate-bc/bc.css" />
  <link rel="stylesheet" href="d.css" />
</head>
<body data-active="employees">
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <main class="page" id="page"></main>
  </div>
</div>
<script src="../gate-a/shell.js"></script>
<script src="d.js"></script>
<script>
  // Plant Head sample: 10 people of X280 only (invented)
  const X280_ROWS = [
    ["1055", "Kavita More", "permanent", "X280", "Worker", "Assembly", "General", null, 160, "active"],
    ["1063", "Nilesh Bhosale", "permanent", "X280", "Operator", "Laser cutting", "Night", null, 175, "active"],
    ["1071", "Dinesh Gaikwad", "permanent", "X280", "Staff", "Dispatch", "General", null, 190, "active"],
    ["1079", "Komal Ingle", "permanent", "X280", "Worker", "Assembly", "General", null, 150, "active"],
    ["1084", "Vishal Gore", "permanent", "X280", "Operator", "Press shop", "Night", null, 175, "active"],
    ["2088", "Rutuja Salunkhe", "temporary", "X280", "Helper", "Assembly", "General", null, 110, "active"],
    ["2089", "Sunita Rane", "temporary", "X280", "Helper", "Packing", "General", "Omkar Labour Services", 110, "active"],
    ["2096", "Tushar Lokhande", "temporary", "X280", "Operator", "Laser cutting", "Night", "Shree Samarth Manpower", 140, "active"],
    ["2101", "Bhagyashree Kale", "temporary", "X280", "Helper", "Stores", "General", "Sai Krupa Enterprises", null, "active"],
    ["2105", "Mangesh Sutar", "temporary", "X280", "Operator", "Press shop", "General", "Jai Hind Staffing", 140, "active"],
  ];

  function filterBtn(label, value, on) {
    return '<button class="f-desk btn btn-outline ' + (on ? "is-on" : "") + '" style="height:38px;' + (on ? "background:var(--primary-soft);border-color:#b9c6ef;color:var(--primary-soft-foreground)" : "") + '">' +
      '<span class="muted" style="font-weight:500;' + (on ? "color:inherit" : "") + '">' + label + '</span><b>' + value + '</b>' + D.icon("chevron-down", 15, "color:var(--muted-foreground)") + "</button>";
  }

  function render() {
    const isPh = D.role === "ph", isCh = D.role === "ch", isSa = D.role === "sa";
    const left = D.has("left");
    const selectedCodes = D.has("selected") || D.has("bulk-shift") || D.has("bulk-ot") || D.has("bulk-left") || D.has("bulk-category") ? ["1001", "1018", "1042"] : D.has("bulk-mixed") ? ["1042", "1055", "2041"] : [];
    const tooMany = D.has("toomany");
    const selectable = !isPh;
    const hide = D.has("columns") ? ["department", "shift"] : [];
    let rowsData = isPh ? X280_ROWS : D.EMP.filter(function (e) { return left ? e[9] === "left" : e[9] === "active"; });
    if (left && !isPh) rowsData = rowsData.concat([
      ["1102", "Prakash Nikam", "permanent", "SPI", "Worker", "Press shop", "General", null, 150, "left", false, "02/10/2026"],
      ["2012", "Archana Dhumal", "temporary", "PC2", "Helper", "Packing", "General", "Sai Krupa Enterprises", 110, "left", false, "25/09/2026"],
      ["1011", "Vaibhav Sonawane", "permanent", "K134", "Operator", "Laser cutting", "Night", null, 175, "left", false, "18/09/2026"],
    ]);
    const total = isPh ? 118 : left ? 37 : 648;
    const shown = rowsData.length;

    // ---- page head ----
    let head = '<div class="page-head anim-fade-up"><div><h1 class="page-title">Employees</h1><p class="page-desc">' +
      (isPh ? "People who work at your plant, X280. You can look but not change." : "Everyone at Sheet Shapers, permanent and temporary. Codes are the company's own employee codes.") + "</p></div>" +
      (isPh ? '<span class="badge badge-neutral">' + D.icon("lock") + "Read-only</span>" :
        '<div class="flex gap-2"><a href="D6-import.html" class="btn btn-outline btn-lg">' + D.icon("file-spreadsheet", 18) + 'Import from Excel</a>' +
        '<a href="D2-employee-form.html" class="btn btn-primary btn-lg">' + D.icon("plus", 18) + "Add employee</a></div>") + "</div>";

    let banner = "";
    if (isCh) banner = '<div class="alert alert-info anim-fade-up" style="margin-bottom:16px" role="note">' + D.icon("shield-check", 20) + "<div><b>Your changes wait for the Super Admin.</b> Add, edit, transfer, bulk change and import all go to the approvals inbox first. You can follow them in <a class=\"link\" href=\"D5-approvals.html#mine+ch\">My requests</a>.</div></div>";
    if (isPh) banner = window.readOnlyBannerD("You see only the employees of X280. Ask the Super Admin for any change.");

    // ---- status tabs (Active / Left / Waiting) ----
    const tabs = '<div class="tabs" role="tablist" aria-label="Employee status" style="margin:0 0 16px">' +
      '<a class="tab" role="tab" href="#" aria-selected="' + (!left) + '">' + D.icon("circle-check") + 'Active<span class="tab-count tnum">' + (isPh ? "118" : "648") + "</span></a>" +
      '<a class="tab" role="tab" href="#left" aria-selected="' + left + '">' + D.icon("log-out") + 'Left<span class="tab-count tnum">' + (isPh ? "9" : "37") + "</span></a>" +
      (isPh ? "" : '<a class="tab" role="tab" href="D5-approvals.html">' + D.icon("hourglass") + 'Change waiting<span class="tab-count tnum">' + (isCh ? "1" : "4") + "</span></a>") + "</div>";

    // ---- toolbar + filters ----
    const noMatch = D.has("no-match");
    const toolbar = '<div class="toolbar"><label class="search-input"><i data-lucide="search"></i><span class="sr-only">Search by code or name</span><input class="input" placeholder="Search code or name" value="' + (noMatch ? "zz" : "") + '" /></label>' +
      (isPh ? "" : filterBtn("Plant", noMatch ? "TP2" : "All", noMatch)) +
      filterBtn("Type", noMatch ? "Temporary" : "Any", noMatch) + filterBtn("Category", "Any", false) + filterBtn("Contractor", D.has("filter-contractor") ? "Omkar Labour Services" : "Any", D.has("filter-contractor")) +
      '<button class="btn btn-outline mobile-only" style="height:42px">' + D.icon("sliders-horizontal", 16) + 'Filters' + (noMatch ? ' <span class="tab-count">2</span>' : "") + '</button><span class="ml-auto flex gap-2 f-desk">' + ((noMatch || D.has("filter-contractor")) ? '<button class="btn btn-ghost" style="height:38px">' + D.icon("x", 15) + "Clear filters</button>" : "") +
      '<button class="btn btn-outline" style="height:38px" aria-haspopup="true">' + D.icon("columns-3", 16) + "Columns</button></span></div>";

    // ---- table body by state ----
    const tableHead = D.empTableHead({ selectable: selectable, hide: hide, allChecked: false });
    let body;
    if (D.has("loading")) body = D.skeletonRows(10, selectable);
    else if (D.has("error")) body = '<tr><td colspan="11" style="padding:48px 20px"><div class="alert alert-danger" role="alert" style="max-width:560px;margin:0 auto">' + D.icon("circle-alert", 20) + '<div style="flex:1"><b>Could not load the employees.</b><div>Check the internet connection and try again. Nothing was changed.</div></div><button class="btn btn-outline btn-sm">' + D.icon("rotate-cw", 15) + "Try again</button></div></td></tr>";
    else if (noMatch) body = "";
    else body = rowsData.map(function (e) { return D.empRow(e, { selectable: selectable, selected: selectedCodes, hide: hide }); }).join("");

    let table = '<div style="overflow-x:auto"><table class="table emp rt">' + tableHead + "<tbody>" + body + "</tbody></table></div>";
    if (noMatch) table = '<div class="empty" style="padding:56px 24px"><div class="empty-icon">' + D.icon("search-x") + '</div><h2>No employees match</h2><p>Nobody matches "zz" with Plant TP2 and Type Temporary. Try a shorter code, remove a filter, or check the spelling.</p><div class="flex justify-center gap-2" style="margin-top:20px"><button class="btn btn-primary btn-lg">' + D.icon("x", 18) + 'Clear filters</button></div></div>';
    if (D.has("empty")) table = '<div class="empty" style="padding:64px 24px 60px"><div class="empty-icon">' + D.icon("users") + '</div><h2>No employees yet</h2><p>Add people one by one, or import the 650 from an Excel sheet. Use the codes Sheet Shapers already has: the system does not make new ones.</p><div class="flex justify-center gap-2" style="margin-top:22px"><a href="D6-import.html" class="btn btn-primary btn-lg">' + D.icon("file-spreadsheet", 18) + 'Import from Excel</a><a href="D2-employee-form.html" class="btn btn-outline btn-lg">' + D.icon("plus", 18) + 'Add employee</a></div><p style="font-size:13px;margin-top:14px">Tip: every plant needs a category first (Staff, Worker, Operator, Helper are added for you).</p></div>';

    // ---- select-all banner ----
    let selectBanner = "";
    if (tooMany) selectBanner = '<div class="bulk-banner" style="background:var(--warning-soft);border-color:#f1d79c;color:#6b3f00">' + D.icon("triangle-alert", 18) + '<span>All <b class="tnum">648</b> matching people are selected. One action can change at most <b>500</b>.</span><button class="btn btn-ghost btn-sm" style="color:inherit"><b>Clear selection</b></button></div>';
    else if (D.has("selected-page")) selectBanner = "";

    // ---- footer ----
    const pageBtns = '<div class="flex gap-2 items-center"><button class="btn btn-outline btn-sm" disabled>Previous</button><span class="tnum" style="padding:0 6px">Page 1 of ' + Math.ceil(total / 50) + '</span><button class="btn btn-outline btn-sm">Next</button></div>';
    const foot = (D.has("empty") || noMatch || D.has("error")) ? "" :
      '<div class="table-foot"><span class="tnum">' + (D.has("loading") ? "Loading…" : "Showing 1–" + shown + " of " + total.toLocaleString("en-IN") + (shown < 50 ? " (sample)" : "")) + "</span>" + pageBtns + '<span class="hide-m-flex">50 per page</span></div>';

    // ---- bulk bar ----
    let bar = "";
    if (selectedCodes.length || tooMany) {
      const n = tooMany ? 648 : selectedCodes.length;
      const dis = tooMany ? " disabled" : "";
      const lead = isCh ? '<span class="grp-label">' + D.icon("send") + "Send for approval:</span>" : "";
      bar = '<div class="bulkbar" role="region" aria-label="Actions for selected employees"><span class="count"><b class="tnum">' + n + "</b>selected</span>" + lead +
        '<button class="btn btn-dark"' + dis + ">" + D.icon("clock-3", 16) + 'Move to shift</button><button class="btn btn-dark"' + dis + ">" + D.icon("tags", 16) + 'Move category</button>' +
        '<button class="btn btn-dark"' + dis + ">" + D.icon("network", 16) + 'Change department</button><button class="btn btn-dark"' + dis + ">" + D.icon("indian-rupee", 16) + "Set OT rate</button>" +
        (isSa ? '<button class="btn btn-dark-danger btn"' + dis + ">" + D.icon("log-out", 16) + "Mark as left</button>" : "") +
        '<button class="btn btn-dark mobile-only">' + D.icon("layers", 16) + (isCh ? "Send for approval" : "Actions") + D.icon("chevron-up", 16) + '</button><button class="btn btn-dark x" aria-label="Clear selection">' + D.icon("x", 18) + "</button></div>" +
        (tooMany ? '<p class="alert alert-warning" role="alert" style="margin:10px auto 0;width:fit-content;max-width:100%">' + D.icon("triangle-alert", 18) + "<span><b>Too many selected.</b> Narrow the filters (for example one plant) or untick some people. All-or-nothing actions are limited to 500.</span></p>" : "");
    }

    document.getElementById("page").innerHTML = head + banner + tabs +
      '<div class="card anim-fade-up anim-delay-1" style="overflow:hidden" id="list-card">' + toolbar + selectBanner + table + foot + "</div>" + bar;
  }

  window.readOnlyBannerD = function (text) {
    return '<div class="ro-banner" role="note">' + D.icon("lock", 18) + "<span><b>Read-only.</b> " + text + "</span></div>";
  };

  // ---------- overlays ----------
  function overlays() {
    const isCh = D.role === "ch";
    const submit = isCh ? D.icon("send", 16) + "Send for approval" : D.icon("check", 16) + "Apply to 3 employees";
    const chNote = isCh ? '<div class="alert alert-info" style="margin-bottom:16px">' + D.icon("shield-check", 20) + "<div><b>This will wait for the Super Admin.</b> Nothing changes until it is approved.</div></div>" : "";
    const people = function (names) { return '<div class="chip-list">' + names.map(function (n) { return '<span class="mini-chip"><span class="code">' + n[0] + "</span>" + n[1] + "</span>"; }).join("") + "</div>"; };
    const allOrNothing = '<div class="field-hint">' + D.icon("info") + "<span>All-or-nothing: if even one person cannot be changed, nobody is changed. One audit entry is written for each person.</span></div>";

    if (D.has("columns")) {
      D.mount('<div class="popover anim-fade-up" style="right:48px;top:308px;width:260px" role="dialog" aria-label="Choose columns"><div class="pop-label">Show columns</div>' +
        ["Code", "Name", "Type", "Plant", "Category", "Department", "Shift", "Contractor", "OT rate", "Status"].map(function (c) {
          const off = c === "Department" || c === "Shift", locked = c === "Code" || c === "Name";
          return '<label class="pop-item"><input type="checkbox" class="cb"' + (off ? "" : " checked") + (locked ? " disabled" : "") + ' /><span class="grow">' + c + "</span>" + (locked ? D.icon("lock", 14, "color:var(--subtle-foreground)") : "") + "</label>";
        }).join("") + '<div class="pop-sep"></div><button class="btn btn-ghost btn-sm" style="width:100%;justify-content:flex-start">' + D.icon("rotate-ccw", 15) + "Reset to default</button></div>");
    }
    if (D.has("filter-contractor")) {
      D.mount('<div class="popover anim-fade-up" style="left:700px;top:292px;width:320px" role="dialog" aria-label="Filter by contractor"><div style="padding:6px 6px 4px"><label class="search-input" style="width:100%"><i data-lucide="search" style="top:11px"></i><input class="input" style="height:40px" placeholder="Find a contractor" /></label></div>' +
        D.CONTRACTORS.map(function (c, i) {
          return '<label class="pop-item ' + (i === 1 ? "is-active" : "") + '"><input type="checkbox" class="cb"' + (i === 1 ? " checked" : "") + ' /><span class="grow">' + c + '</span><span class="pop-count tnum">' + [48, 62, 71, 39, 55][i] + "</span></label>";
        }).join("") + '<div class="pop-sep"></div><div class="pop-item muted" style="font-size:13px">' + D.icon("info", 15) + "Shows temporary workers only</div></div>");
    }
    if (D.has("bulk-shift")) {
      D.mount(D.dialog({
        icon: "clock-3", title: "Move 3 employees to a shift", desc: "All three work at <b>K134</b>, so you can choose from the shifts of K134.",
        body: chNote + '<div class="space-y-4"><div>' + people([["1001", "Ramesh Kulkarni"], ["1018", "Anjali Deshpande"], ["1042", "Pradeep Jadhav"]]) + "</div>" +
          '<div class="form-grid"><div><label class="label" for="bs">New shift<span class="req" aria-hidden="true">*</span></label><select id="bs" class="input select"><option>Night 19:00–07:00</option><option>General 07:00–19:00</option></select></div>' +
          '<div><label class="label" for="bd">Starts on</label><input id="bd" class="input tnum" value="15/10/2026" /><div class="help" style="margin-top:4px">Today or later. Not in the past.</div></div></div>' +
          '<div><label class="label" for="br">Reason<span class="req" aria-hidden="true">*</span></label><textarea id="br" class="input textarea" placeholder="Why is this change needed?">Press line B runs at night from 19/10.</textarea></div>' + allOrNothing + "</div>",
        foot: '<button class="btn btn-outline btn-lg">Cancel</button><button class="btn btn-primary btn-lg">' + submit.replace("employees", "employees") + "</button>",
      }));
    }
    if (D.has("bulk-ot")) {
      D.mount(D.dialog({
        icon: "indian-rupee", title: "Set the overtime rate for 3 employees", desc: "One rate for everyone selected, in rupees per overtime hour.",
        body: chNote + '<div class="space-y-4"><div>' + people([["1001", "Ramesh Kulkarni"], ["1018", "Anjali Deshpande"], ["1042", "Pradeep Jadhav"]]) + "</div>" +
          '<div><label class="label" for="ot">New OT rate<span class="req" aria-hidden="true">*</span></label><div class="rupee-input" style="max-width:260px"><span class="unit-l">₹</span><input id="ot" class="input tnum" value="190" inputmode="decimal" /><span class="unit">per hour</span></div></div>' +
          '<div class="mini-wrap"><table class="mini-table"><thead><tr><th>Employee</th><th>Now</th><th>After</th></tr></thead><tbody>' +
          '<tr><td>1001 Ramesh Kulkarni</td><td class="tnum">₹220/h</td><td class="tnum"><b>₹190/h</b> <span class="badge badge-warning" style="height:20px;margin-left:4px">' + D.icon("arrow-down") + "Lower</span></td></tr>" +
          '<tr><td>1018 Anjali Deshpande</td><td><span class="miss">' + D.icon("triangle-alert") + 'Missing</span></td><td class="tnum"><b>₹190/h</b></td></tr>' +
          '<tr><td>1042 Pradeep Jadhav</td><td class="tnum">₹185/h</td><td class="tnum"><b>₹190/h</b></td></tr></tbody></table></div>' +
          '<div><label class="label" for="or">Reason<span class="req" aria-hidden="true">*</span></label><textarea id="or" class="input textarea">New wage agreement, effective October 2026.</textarea></div>' + allOrNothing + "</div>",
        foot: '<button class="btn btn-outline btn-lg">Cancel</button><button class="btn btn-primary btn-lg">' + submit + "</button>",
      }));
    }
    if (D.has("bulk-category")) {
      D.mount(D.dialog({
        icon: "tags", title: "Move 3 employees to another category", desc: "All three work at <b>K134</b>, so you can choose from the categories of K134.",
        body: chNote + '<div class="space-y-4"><div>' + people([["1001", "Ramesh Kulkarni"], ["1018", "Anjali Deshpande"], ["1042", "Pradeep Jadhav"]]) + "</div>" +
          '<div><label class="label" for="bc">New category<span class="req" aria-hidden="true">*</span></label><select id="bc" class="input select" style="max-width:320px"><option>Operator</option><option>Staff</option><option>Worker</option><option>Helper</option></select></div>' +
          '<div><label class="label" for="bcr">Reason<span class="req" aria-hidden="true">*</span></label><textarea id="bcr" class="input textarea" placeholder="Why is this change needed?">Re-grading after the skills test.</textarea></div>' + allOrNothing + "</div>",
        foot: '<button class="btn btn-outline btn-lg">Cancel</button><button class="btn btn-primary btn-lg">' + submit + "</button>",
      }));
    }
    if (D.has("bulk-left")) {
      D.mount(D.dialog({
        icon: "log-out", tone: "di-danger", alert: true, title: "Mark 3 employees as left", desc: "Only the Super Admin can do this. Nothing is deleted.", width: 600,
        body: '<div class="space-y-4">' + people([["1001", "Ramesh Kulkarni"], ["1018", "Anjali Deshpande"], ["1042", "Pradeep Jadhav"]]) +
          '<div class="alert alert-warning" role="note" style="margin-top:4px">' + D.icon("triangle-alert", 20) + "<div><b>They will stop being able to punch.</b> A change waiting for 1042 is closed as \"Could not apply\". Their history stays for the Labour Codes.</div></div>" +
          '<div class="form-grid"><div><label class="label" for="bl">Last working day<span class="req" aria-hidden="true">*</span></label><input id="bl" class="input tnum" value="14/10/2026" /></div><div><label class="label" for="blr">Reason<span class="req" aria-hidden="true">*</span></label><select id="blr" class="input select"><option>Contract ended</option><option>Resigned</option><option>Terminated</option></select></div></div>' + allOrNothing + "</div>",
        foot: '<button class="btn btn-outline btn-lg">Cancel</button><button class="btn btn-lg" style="background:var(--danger);color:#fff">' + D.icon("log-out", 16) + "Mark 3 as left</button>",
      }));
    }
    if (D.has("bulk-mixed")) {
      D.mount(D.dialog({
        icon: "triangle-alert", tone: "di-warning", title: "Choose people from one plant", alert: true,
        desc: "Shifts, categories and departments belong to a plant, so one action cannot cover several plants.",
        body: '<div class="alert alert-warning" role="alert">' + D.icon("triangle-alert", 20) + "<div><b>The 3 people you selected work in 3 plants.</b></div></div>" +
          '<div class="mini-wrap" style="margin-top:14px"><table class="mini-table"><thead><tr><th>Employee</th><th>Plant</th></tr></thead><tbody><tr><td>1042 Pradeep Jadhav</td><td><b class="code">K134</b></td></tr><tr><td>1055 Kavita More</td><td><b class="code">X280</b></td></tr><tr><td>2041 Ravi Patil</td><td><b class="code">TP1</b></td></tr></tbody></table></div>' +
          '<p class="muted" style="margin:14px 0 0;font-size:14px">Tip: "Set OT rate" has no plant rule and works for all three.</p>',
        foot: '<button class="btn btn-outline btn-lg">Back to the list</button><button class="btn btn-primary btn-lg">' + D.icon("filter", 16) + "Keep only K134 (1)</button>",
      }));
    }
  }

  window.onMockState = function () {
    D.patchShell();
    render();
    overlays();
    const titles = { loading: "loading (skeleton rows)", empty: "no employees yet", "no-match": "filters match nobody", error: "could not load", left: "Left tab", selected: "3 selected, bulk bar", toomany: "648 selected, over the 500 limit", columns: "column chooser", "filter-contractor": "contractor filter open", "bulk-shift": "bulk: move to shift", "bulk-mixed": "bulk: several plants (blocked)", "bulk-ot": "bulk: set OT rate", "bulk-left": "bulk: mark as left", "bulk-category": "bulk: move category" };
    const key = Object.keys(titles).filter(D.has)[0];
    D.tag((key ? titles[key] : "Active employees") + " · " + D.roleName);
  };
</script>
<style>
  .hide-m-flex { color: var(--muted-foreground); }
  .bulkbar { flex-wrap: nowrap; }
  .bulkbar .btn-dark, .bulkbar .btn-dark-danger { padding: 0 12px; }
  @media (max-width: 640px) { .f-desk, .bulkbar .btn-dark:not(.mobile-only):not(.x), .bulkbar .btn-dark-danger, .bulkbar .grp-label { display: none !important; } .bulkbar { width: 100%; justify-content: space-between; } .hide-m-flex { display: none; } .tabs { margin-bottom: 12px; } .bulkbar { padding: 8px 8px 8px 12px; gap: 8px; } .bulkbar .count { padding-right: 8px; } .bulkbar .mobile-only { flex: 1; min-width: 0; justify-content: space-between; } .page-head .btn { min-width: 0; padding: 0 10px; } }
</style>
</body>
</html>
