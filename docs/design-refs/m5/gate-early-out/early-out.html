<!doctype html>
<!-- Upasthiti M5 - gate early OUT dialog. MOCKUP ONLY: static HTML, fake data, no person shown.
     ?v=1 (before half shift, amber) or ?v=2 (after half shift, blue notice). Add &shot to freeze the bar. -->
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate attendance - early OUT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--border:#dde2ea;--ink:#0e1726;--muted:#4a5567;--primary:#1f3a93;--primary-dark:#142a6b;--signal:#f5b700;
--warn:#7a4500;--warn-soft:#fff3d6;--warn-edge:#b97300;--info:#1a3282;--info-soft:#eaeefb;--info-edge:#8da0e0;
--font:"Inter","Noto Sans Devanagari",ui-sans-serif,system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden}
.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--signal) 0 22px,var(--ink) 22px 44px)}
.top{display:flex;align-items:center;gap:16px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--border);min-height:76px}
.logo{width:48px;height:48px;border-radius:12px;background:var(--primary);flex:none}
.top b{font-size:26px;display:block;line-height:1.1}.top span{font-size:24px;color:var(--muted)}
.clock{margin-left:auto;font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bgcam{margin:20px 24px;height:60vh;border-radius:20px;background:radial-gradient(ellipse at 50% 38%,#59616f,#3b414c 55%,#262b34);border:4px solid var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(14,23,38,.72);display:grid;place-items:center;padding:16px}
.dlg{width:min(760px,100%);max-height:100%;background:#fff;border:4px solid var(--ink);border-radius:26px;box-shadow:0 10px 0 var(--ink);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr)}
.head>div:last-child{min-width:0}.body{min-width:0}.head{display:flex;align-items:center;gap:20px;padding:20px 28px;border-bottom:4px solid var(--ink)}
.v1 .head{background:var(--warn-soft);color:var(--warn)}
.v2 .head{background:var(--info-soft);color:var(--info)}
.ic{width:84px;height:84px;flex:none;border-radius:99px;background:#fff;display:grid;place-items:center;border:5px solid currentColor}
.ic svg{width:48px;height:48px}
h1{margin:0;font-size:36px;line-height:1.12;font-weight:850;letter-spacing:-.02em;color:var(--ink)}
.tag{display:inline-flex;gap:8px;align-items:center;font-size:24px;font-weight:750;margin-bottom:4px}
.body{padding:22px 28px 8px;display:grid;gap:14px}
.rows{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:16px;border:3px solid var(--ink);border-radius:18px;padding:12px 18px;background:var(--bg)}
.row svg{width:36px;height:36px;flex:none}
.row .l{font-size:24px;font-weight:650;color:var(--muted);line-height:1.2;flex:1;min-width:0}
.row .l small{display:block;font-size:24px;font-weight:500}
.row .t{font-size:44px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.v1 .row.main{background:var(--warn-soft);border-color:var(--warn-edge)}.v1 .row.main .t{color:var(--warn)}
.v2 .row.main{background:var(--info-soft);border-color:var(--info-edge)}.v2 .row.main .t{color:var(--info)}
.sent{font-size:28px;font-weight:700;line-height:1.3;margin:2px 0 0}
.timer{display:flex;align-items:center;gap:16px;font-size:24px;font-weight:650;color:var(--muted)}
.bar{flex:1;height:18px;border-radius:99px;background:#e3e7ee;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:65%;background:var(--primary);border-radius:99px;animation:drain 20s linear forwards}
.ring{position:relative;width:64px;height:64px;flex:none}.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:850;color:var(--ink);font-variant-numeric:tabular-nums}
.shot .bar i{animation:none}
@keyframes drain{from{width:100%}to{width:0}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px 28px 28px}
.btn{display:flex;align-items:center;justify-content:center;gap:14px;min-height:92px;border-radius:22px;font:800 34px/1.1 var(--font);cursor:pointer;border:0}
.btn svg{width:40px;height:40px;flex:none}
.agree{background:var(--primary);color:#fff;box-shadow:0 7px 0 var(--primary-dark)}
.cancel{background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink)}
.cancel:focus-visible,.agree:focus-visible{outline:5px solid var(--signal);outline-offset:4px}
@media (max-width:600px){
 .top{padding:8px 14px;min-height:64px}.clock{font-size:34px}.top b{font-size:24px}.top span{display:none}.logo{width:40px;height:40px}
 .bgcam{margin:14px;height:40vh}
 .scrim{padding:8px;align-items:end}
 .dlg{border-radius:22px}
 .head{padding:14px 16px;gap:14px}.ic{width:64px;height:64px;border-width:4px}.ic svg{width:36px;height:36px}
 h1{font-size:28px}
 .body{padding:12px 16px 2px;gap:8px}.rows{gap:8px}
 .row{padding:8px 12px;gap:10px;display:grid;grid-template-columns:30px minmax(0,1fr);}.row svg{width:30px;height:30px}.row .l small{display:inline;margin-left:6px}.row .t{grid-column:2;font-size:36px;line-height:1}.ring{display:none}.tag{display:none}.timer{gap:12px}.timer span{white-space:nowrap}
 .sent{font-size:26px}
 .btns{grid-template-columns:1fr;padding:10px 16px 20px;gap:14px}
 .agree{order:1}.cancel{order:2}
 .btn{min-height:72px;font-size:32px}.scrim{width:100%}
}
@media (min-width:1000px){.dlg{width:min(900px,100%)}.row .t{font-size:52px}h1{font-size:42px}}
</style></head><body>
<div class="stripe"></div>
<div class="top"><div class="logo"></div><div><b>Sheet Shapers &middot; Plant 3</b><span>Main gate attendance</span></div><div class="clock">11:10:04</div></div>
<div class="bgcam"></div>
<div class="scrim" role="alertdialog" aria-modal="true" aria-labelledby="t">
<div class="dlg" id="dlg">
 <div class="head"><div class="ic" id="ic"></div><div><div class="tag" id="tag"></div><h1 id="t"></h1></div></div>
 <div class="body">
  <div class="rows" id="rows"></div>
  <p class="sent" id="sent"></p>
  <div class="timer"><div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="#e3e7ee" stroke-width="8"/><circle cx="32" cy="32" r="27" fill="none" stroke="#1f3a93" stroke-width="8" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="59"/></svg><b>13</b></div><div class="bar"><i></i></div><span>Cancels in 13 s</span></div>
 </div>
 <div class="btns"><button class="btn agree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Agree</button><button class="btn cancel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Cancel</button></div>
</div></div>
<script>
const q=new URLSearchParams(location.search),v=q.get('v')||'1';
if(q.has('shot'))document.body.classList.add('shot');
document.getElementById('dlg').className='dlg v'+v;
const S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">';
const warn=S+'<path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4M12 17h.01"/></svg>';
const clock=S+'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';
const hg=S+'<path d="M5 22h14M5 2h14M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4a2 2 0 0 0-.6 1.4V22M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4a2 2 0 0 0 .6-1.4V2"/></svg>';
const flag=S+'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/></svg>';
const row=(i,l,s,t,m)=>'<div class="row '+(m?'main':'')+'">'+i+'<div class="l">'+l+'<small>'+s+'</small></div><div class="t">'+t+'</div></div>';
const $=id=>document.getElementById(id);
if(v==='1'){
 $('ic').innerHTML=warn;$('tag').textContent='Leaving early';
 $('t').textContent='Your half shift is not complete yet';
 $('rows').innerHTML=row(hg,'Half shift complete in','at 13:00','1 h 50 min',1)+row(flag,'Full shift ends in','at 17:00','5 h 50 min',0);
 $('sent').textContent='If you leave now, your day may count as short hours.';
}else{
 $('ic').innerHTML=clock;$('tag').textContent='Leaving early';
 $('t').textContent='Your full shift is not over yet';
 $('rows').innerHTML=row(flag,'Full shift ends in','at 17:00','1 h 35 min',1);
 $('sent').textContent='If you leave now, your day may count as a half day.';
}
</script></body></html>
