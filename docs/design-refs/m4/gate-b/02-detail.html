  /* The list sits behind the sheet. Which tab and which row is open depends on the state. */

  const st = S === "default" ? "edge" : S;

    document.getElementById("page").innerHTML = listPage({ tab: m[0], openId: m[1], showCooldown: st === "rejected-cooldown" });
