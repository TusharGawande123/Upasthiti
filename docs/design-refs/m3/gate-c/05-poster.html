<!doctype html>
<!--
  Upasthiti - M3 design gate C - Screen 5: the A4 gate poster with both ways to punch (F-34, spec 4.14, 8.1).
  States (URL hash): k134 (default) · long-name (a 100-letter plant name: the plant line shrinks, then wraps, as poster_pdf.py does).
  Drawn in mm and pt so it maps 1:1 onto the fpdf2 code (backend/app/modules/printing/poster_pdf.py). MOCKUP ONLY.
-->
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upasthiti gate poster</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { --ink: #0e1726; --muted: #3d4757; --signal: #f5b700; --blue: #1f3a93; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #d9dde4; font-family: "Inter", sans-serif; color: var(--ink); }
    body:not(.shot) { padding: 24px 0; }
    #a4 { position: relative; width: 210mm; height: 297mm; margin: 0 auto; background: #fff; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
    .stripe { position: absolute; left: 0; right: 0; height: 6mm; background: repeating-linear-gradient(-63deg, var(--ink) 0 2.6mm, var(--signal) 2.6mm 5.2mm); }
    .abs { position: absolute; left: 16mm; right: 16mm; }
    h1 { margin: 0; font-size: 30pt; line-height: 13mm; font-weight: 700; letter-spacing: -0.02em; }
    .plant { color: var(--muted); font-size: 16pt; line-height: 8mm; }
    .plant.small { font-size: 12pt; line-height: 6mm; }
    .plant.wrap { font-size: 11pt; line-height: 5mm; }
    .box { border: 0.8mm solid var(--ink); border-radius: 4mm; }
    .ways-title { font-size: 16pt; font-weight: 700; display: flex; align-items: center; gap: 3mm; }
    .ways-title .num { width: 14mm; height: 14mm; border-radius: 99px; background: var(--signal); border: 0.5mm solid var(--ink); display: grid; place-items: center; font-size: 20pt; font-weight: 700; }
    .ways { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
    .way { padding: 5mm 5mm 4mm; display: flex; flex-direction: column; gap: 2.5mm; }
    .way-tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 1.5mm; height: 7mm; padding: 0 3mm; border-radius: 99px; border: 0.5mm solid var(--ink); font-size: 11pt; font-weight: 700; letter-spacing: .06em; }
    .way-tag svg { width: 4.5mm; height: 4.5mm; }
    .way .big { width: 18mm; height: 18mm; stroke-width: 1.6; }
    .way h2 { margin: 0; font-size: 17pt; line-height: 7.6mm; font-weight: 700; letter-spacing: -0.01em; }
    .way p { margin: 0; font-size: 13pt; line-height: 6mm; color: var(--muted); }
    .mini-steps { display: grid; gap: 2mm; margin-top: 0; }
    .ms { display: grid; grid-template-columns: 22mm 1fr; gap: 3mm; align-items: center; font-size: 12.5pt; line-height: 5.6mm; color: var(--ink); }
    .facebtn { height: 13mm; border-radius: 3mm; background: var(--blue); box-shadow: 0 1.2mm 0 #15286a; color: #fff; display: flex; align-items: center; justify-content: center; gap: 1mm; font-size: 8pt; font-weight: 700; line-height: 1.05; padding: 0 1.5mm; text-align: left; }
    .facebtn .fi { width: 7mm; height: 7mm; border-radius: 1.6mm; background: #fff; color: var(--blue); display: grid; place-items: center; flex: none; }
    .facebtn .fi svg { width: 5mm; height: 5mm; }
    .pose { width: 22mm; height: 18mm; border-radius: 3mm; border: 0.4mm solid #b9c6ef; background: #eaeefb; overflow: hidden; }
    .pose svg { width: 100%; height: 100%; }
    .keyic { width: 22mm; height: 13mm; border-radius: 3mm; border: 0.5mm solid var(--ink); display: grid; place-items: center; font: 700 12pt "Inter"; letter-spacing: .04em; }
    .step3 { display: grid; grid-template-columns: 18mm 1fr; gap: 5mm; align-items: center; padding: 4mm 5mm; }
    .step3 .num { width: 14mm; height: 14mm; border-radius: 99px; background: var(--signal); border: 0.5mm solid var(--ink); display: grid; place-items: center; font-size: 20pt; font-weight: 700; }
    .step3 svg { width: 16mm; height: 16mm; stroke-width: 1.6; }
    .step3 h2 { margin: 0; font-size: 19pt; line-height: 8.5mm; }
    .step3 p { margin: 0; font-size: 13pt; color: var(--muted); }
    .note { display: grid; grid-template-columns: 18mm 1fr; gap: 5mm; padding: 4mm 5mm; }
    .note > svg { width: 18mm; height: 18mm; stroke-width: 1.7; }
    .note h3 { margin: 0 0 1mm; font-size: 16pt; line-height: 7.5mm; }
    .note p { margin: 0 0 1.6mm; font-size: 12.5pt; line-height: 5.9mm; }
    .note p:last-child { margin-bottom: 0; }
    .note .lead { font-weight: 700; font-size: 13.5pt; }
    .url { font-weight: 700; }
    .help { text-align: center; font-size: 13pt; font-weight: 700; }
    .callout { position: absolute; z-index: 5; background: #ffe24d; color: #000; font: 600 9px/1.3 "Inter"; padding: 3px 6px; border-radius: 4px; border: 1px solid #000; }
    body.shot .callout, body.clean .callout { display: none; }
  </style>
</head>
<body>
<div id="a4" aria-label="A4 gate poster"></div>
<script src="shell.js"></script>
<script>
  const S = location.hash.replace("#", "") || "k134";
  if (location.search.indexOf("shot") >= 0) document.body.classList.add("shot");
  const PLANT = S === "long-name" ? "Sheet Shapers India Private Limited, Press Shop and Tool Room, Plot K-134 Extension, MIDC Waluj Industrial Area · K134" : "Sheet Shapers India Pvt Ltd (K-134) · K134";
  const DAYS = 60;
  const ic = (n, c) => `<i data-lucide="${n}"${c ? ` class="${c}"` : ""}></i>`;
  const plantClass = PLANT.length > 90 ? "wrap" : PLANT.length > 60 ? "small" : "";
  document.getElementById("a4").innerHTML = `
    <div class="stripe" style="top:0"></div>
    <div class="abs" style="top:16mm"><h1>Attendance at this gate</h1><div class="plant ${plantClass}" style="margin-top:1mm">${PLANT}</div></div>

    <div class="abs" style="top:42mm"><div class="ways-title">Punch in one of two ways</div></div>
    <div class="abs ways" style="top:51mm;height:90mm">
      <div class="box way">${ic("id-card", "big")}
        <h2>Card: hold your card to the camera</h2>
        <p>Hold it still, about 20 cm from the camera.</p><p>Then look at the camera: a photo is taken with every card punch.</p></div>
      <div class="box way">        <h2>Face: tap Punch with face, turn your head as the arrow shows</h2>
        <div class="mini-steps">
          <div class="ms"><span class="facebtn"><span class="fi">${ic("scan-face")}</span>Punch with face</span><span>Tap the blue button.</span></div>
          <div class="ms"><span class="pose">${window.poseSvg("left")}</span><span>Turn your head as the arrow shows, then look straight.</span></div>
          <div class="ms"><span class="keyic">0123</span><span>If the screen asks, type your employee code.</span></div>
        </div></div>
    </div>

    <div class="abs box step3" style="top:146mm">${ic("log-in")}<div><h2>See IN or OUT on the screen</h2><p>Your name and the time are shown. That is all.</p></div></div>

    <div class="abs box note" style="top:174mm">${ic("octagon-x")}<div><h3>If it says NOT ACCEPTED, go to the plant office.</h3><p>Do not try again and again. The office can see why and will help you.</p></div></div>

    <div class="abs box note" style="top:203mm;height:78mm">${ic("shield-check")}<div><h3>About your face and the photo</h3>
      <p class="lead">Pressing Punch with face means your face is checked.</p>
      <p>Face punch: your face is checked against an encrypted record. A photo is kept for ${DAYS} days only if the punch fails or you type your code. Card punch: a photo is kept for ${DAYS} days and checked automatically to see that a face is present.</p>
      <p>Only the Super Admin can open a photo, and every view is recorded. Face data is never shared and never sent to any AI company. Your punch times are kept as attendance records, as the law requires.</p><p>Full privacy notice: <span class="url">upasthiti-chi.vercel.app/privacy</span></p></div></div>

    <div class="abs help" style="top:284mm">Need help? Ask the plant office.</div>
    <div class="stripe" style="top:291mm"></div>`;
  if (window.lucide) window.lucide.createIcons();
</script>
</body>
</html>
