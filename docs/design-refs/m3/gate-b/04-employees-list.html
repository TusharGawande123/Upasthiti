<!doctype html>
<!--
  Upasthiti - M3 design gate B - Screen 4: employees list with the new "Face" column and "Face" filter (spec 4.10).
  States (URL hash): default, filter-open, filtered (Face = Re-enrol suggested), empty, loading, error.
  Desktop 1280 = table. Below 768 px the table becomes cards. MOCKUP ONLY - static HTML, fake data.
-->
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upasthiti employees list</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="m3.css" />
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="state-tag" id="state-tag"></div>
<script src="shell.js"></script>
<script>
  window.MOCK_USER = { name: "Asha Rao", role: "Super Admin" };

  /* Face badges: icon + word, never colour alone. "Card" is for rows that punch with a QR card. */
  const FACE = {
    enrolled: '<span class="badge face-badge badge-success"><i data-lucide="scan-face"></i>Enrolled</span>',
    none: '<span class="badge face-badge badge-neutral"><i data-lucide="circle-dashed"></i>Not enrolled</span>',
    reenrol: '<span class="badge face-badge badge-warning"><i data-lucide="triangle-alert"></i>Re-enrol suggested</span>',
    old: '<span class="badge face-badge badge-warning"><i data-lucide="history"></i>Old model</span>',
    card: '<span class="badge face-badge badge-outline"><i data-lucide="qr-code"></i>Card</span>',
  };
  const ROWS = [
    ["Sunita Jadhav", "EMP-0312", "permanent", "K134", "Operator", "General", "enrolled"],
    ["Ganesh Shinde", "EMP-0118", "permanent", "K134", "Staff", "General", "reenrol"],
    ["Rekha Bhosale", "EMP-0204", "permanent", "PC1", "Worker", "General", "none"],
    ["Santosh Gaikwad", "T-2041", "temporary", "K134", "Helper", "General", "card"],
    ["Mohan Deshmukh", "EMP-0077", "permanent", "TP1", "Operator", "General", "enrolled"],
    ["Priya Kulkarni", "EMP-0390", "permanent", "SPI", "Staff", "General", "enrolled"],
    ["Ramesh Patil", "EMP-0457", "permanent", "TP1", "Worker", "General", "enrolled"],
    ["Anil Pawar", "T-2058", "temporary", "X280", "Operator", "General", "card"],
  ];
  const TYPE = {
    permanent: '<span class="badge badge-info"><i data-lucide="scan-face"></i>Permanent</span>',
    temporary: '<span class="badge badge-warning"><i data-lucide="qr-code"></i>Temporary</span>',
  };
  const sel = (label, value, active, extra) => `<div class="sel ${active ? "is-active" : ""}"><select aria-label="${label}"><option>${value}</option></select><i data-lucide="chevron-down"></i>${extra || ""}</div>`;

  function toolbar(state) {
    const faceVal = state === "filtered" ? "Face: Re-enrol suggested" : "Face: any";
    const pop = state === "filter-open" ? `<div class="pop" role="listbox" aria-label="Face filter">
      <div class="sel-on" role="option" aria-selected="true"><i data-lucide="check"></i>Any</div>
      <div role="option"><i data-lucide="scan-face"></i>Enrolled</div>
      <div role="option"><i data-lucide="circle-dashed"></i>Not enrolled</div>
      <div role="option"><i data-lucide="triangle-alert"></i>Re-enrol suggested</div>
      <div role="option"><i data-lucide="history"></i>Old model</div></div>` : "";
    return `<div class="toolbar"><input class="input" type="search" placeholder="Search name or code" aria-label="Search name or code" />
      ${sel("Status", "Active")}${sel("Type", "Any type")}${sel("Contractor", "Any contractor")}
      <div style="position:relative">${sel("Face filter (new)", faceVal, state === "filtered" || state === "filter-open")}${pop}</div></div>`;
  }

  function rowsDesktop(rows) {
    return rows.map(function (r) {
      return `<tr><td style="width:44px;padding-left:16px"><input type="checkbox" aria-label="Select ${r[0]}" style="width:20px;height:20px;accent-color:var(--primary)" /></td>
        <td><div class="emp-cell"><span class="avatar">${window.initialsOf(r[0])}</span><div><b>${r[0]}</b><span class="c code">${r[1]}</span></div></div></td>
        <td>${TYPE[r[2]]}</td><td><span class="code" style="font-weight:700">${r[3]}</span></td><td>${r[4]}</td><td>${r[5]}</td>
        <td>${FACE[r[6]]}</td><td style="width:48px"><a class="btn btn-ghost btn-icon" aria-label="Open ${r[0]}"><i data-lucide="chevron-right"></i></a></td></tr>`;
    }).join("");
  }
  function cards(rows) {
    return rows.map(function (r) {
      return `<a class="ecard"><div class="ecard-top"><span class="avatar">${window.initialsOf(r[0])}</span><div style="min-width:0"><b>${r[0]}</b><span class="c code">${r[1]} · ${r[3]} · ${r[4]}</span></div><i data-lucide="chevron-right" class="chev"></i></div>
        <div class="ecard-badges">${TYPE[r[2]]}${FACE[r[6]]}</div></a>`;
    }).join("");
  }

  function table(rows) {
    return `<div style="overflow-x:auto"><table class="table elist"><thead><tr><th style="width:44px;padding-left:16px"><span class="sr-only">Select</span></th><th>Employee</th><th>Type</th><th>Plant</th><th>Category</th><th>Shift</th><th>Face</th><th><span class="sr-only">Open</span></th></tr></thead><tbody>${rowsDesktop(rows)}</tbody></table></div><div class="ecards">${cards(rows)}</div>`;
  }

  function loadingRows() {
    const d = [44, 220, 100, 50, 90, 80, 130, 24].map(function (w, i) { return `<td${i === 0 ? ' style="padding-left:16px"' : ""}><div class="skeleton" style="height:16px;width:${w}px"></div></td>`; }).join("");
    const c = `<div class="ecard"><div class="ecard-top"><div class="skeleton" style="width:44px;height:44px;border-radius:99px"></div><div style="display:grid;gap:8px"><div class="skeleton" style="height:16px;width:150px"></div><div class="skeleton" style="height:12px;width:110px"></div></div></div><div class="ecard-badges"><div class="skeleton" style="height:26px;width:90px;border-radius:99px"></div><div class="skeleton" style="height:30px;width:120px;border-radius:99px"></div></div></div>`;
    return `<div style="overflow-x:auto"><table class="table elist" aria-busy="true"><thead><tr><th></th><th>Employee</th><th>Type</th><th>Plant</th><th>Category</th><th>Shift</th><th>Face</th><th></th></tr></thead><tbody>${("<tr>" + d + "</tr>").repeat(8)}</tbody></table></div><div class="ecards">${c.repeat(5)}</div>`;
  }

  window.mockStart(function (state) {
    state = state || "default";
    let rows = ROWS, foot = "Showing 1–8 of 312";
    if (state === "filtered") { rows = [ROWS[1], ["Vijay Salunke", "EMP-0231", "permanent", "PC2", "Operator", "General", "reenrol"], ["Kavita More", "EMP-0166", "permanent", "K134", "Worker", "General", "reenrol"]]; foot = "Showing 1–3 of 9 · Face: Re-enrol suggested"; }
    let content;
    if (state === "loading") content = loadingRows();
    else if (state === "empty") content = `<div class="empty"><div class="big-icon"><i data-lucide="search-x"></i></div><h2>No employee matches these filters</h2><p>No one has “Old model” in plant K134 with these filters. Try a different Face filter.</p><button class="btn btn-outline btn-lg"><i data-lucide="x"></i>Clear filters</button></div>`;
    else if (state === "error") content = `<div class="alert alert-danger" style="margin:16px"><i data-lucide="circle-alert"></i><span>The list could not be loaded. Check the internet connection.</span><button class="btn btn-outline" style="margin-left:auto">Try again</button></div>`;
    else content = table(rows);
    const stateForToolbar = state === "empty" ? "filtered" : state;
    document.getElementById("page").innerHTML = `
      <div class="page-head anim-fade-up"><div><h1 class="page-title">Employees</h1><p class="page-desc">Face status is shown for employees who punch with their face. Employees with a QR card show “Card”.</p></div>
        <div class="row-wrap"><button class="btn btn-outline btn-lg"><i data-lucide="upload"></i>Import</button><button class="btn btn-primary btn-lg"><i data-lucide="plus"></i>Add employee</button></div></div>
      <div class="card anim-fade-up" style="overflow:visible">${toolbar(stateForToolbar)}${content}
        ${state === "loading" || state === "empty" || state === "error" ? "" : `<div class="table-foot"><span>${foot}</span><div class="pager"><button class="btn btn-outline" disabled><i data-lucide="chevron-left"></i>Previous</button><button class="btn btn-outline">Next<i data-lucide="chevron-right"></i></button></div></div>`}</div>`;
    document.getElementById("topbar").innerHTML = `<button class="menu-btn" aria-label="Open menu"><i data-lucide="menu"></i></button><span class="topbar-brand">${window.upasthitiLogo(30)}<span>Upasthiti</span></span><button class="search-trigger"><i data-lucide="search"></i><span>Search employees, plants, pages…</span><span class="kbd-group"><span class="kbd">Ctrl</span><span class="kbd">K</span></span></button><button class="btn btn-outline plant-filter"><i data-lucide="factory" style="color:var(--muted-foreground)"></i><span>All plants</span><i data-lucide="chevrons-up-down" style="color:var(--subtle-foreground)"></i></button><div class="spacer"></div><button class="user-trigger"><span class="avatar" style="width:40px;height:40px">AR</span><span class="user-meta"><b>Asha Rao</b><span>Super Admin</span></span><i data-lucide="chevron-down" style="width:16px;height:16px;color:var(--muted-foreground)"></i></button>`;
  });
</script>
</body>
</html>
