<!doctype html>
<!--
  Upasthiti – M2 design gate A – Screen 07: Excel import result with the "Issue and print cards" step (F-38).
  Spec M2 §4.12 (import result), §5.7 (created_employee_ids), §7 rule 3 (bulk issue, F-38), §7 rule 1.
  States (URL hash): (none) / #done Super Admin import finished · #approved (Super Admin approved a Corporate Head's import request) ·
  #confirm (confirm dialog) · #issued (follow-up: cards issued, print in parts) · #corporate-head (import sent for approval, no card button) ·
  #no-qr (a file with face employees only). MOCKUP ONLY – static HTML, fake data.
-->
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upasthiti Import result</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="bc.css" />
  <link rel="stylesheet" href="d.css" />
  <link rel="stylesheet" href="m2.css" />
</head>
<body data-active="import">
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <main class="page" id="page"></main>
  </div>
</div>
<script src="shell.js"></script>
<script src="d.js"></script>
<script src="d-extra.js"></script>
<script src="m2.js"></script>
<script>
  const approved = D.has("approved");
  const noQr = D.has("no-qr");
  const issued = D.has("issued");

  const chips = function (perm, temp) {
    return '<div class="flex justify-center gap-2 flex-wrap" style="margin-bottom:22px"><span class="badge badge-info">' + D.icon("scan-face") + '<span class="tnum">' + perm + '</span>&nbsp;Permanent (face)</span><span class="badge badge-warning">' + D.icon("qr-code") + '<span class="tnum">' + temp + '</span>&nbsp;Temporary (QR card)</span><span class="badge badge-outline"><span class="tnum">7</span>&nbsp;plants</span></div>';
  };

  // the "next step" box under the result (Super Admin only)
  function nextStep() {
    if (noQr) {
      return '<div class="next-step" style="background:var(--muted);border-color:var(--border)"><span class="ns-icon" style="background:var(--surface);color:var(--muted-foreground);border:1px solid var(--border)">' + D.icon("scan-face") + '</span><div style="flex:1"><b style="font-size:16px">No QR cards are needed for this file.</b><div class="muted">All 38 people punch by face. There is nobody to issue a card to.</div></div></div>';
    }
    return '<div class="next-step"><span class="ns-icon">' + D.icon("qr-code") + '</span><div style="flex:1"><b style="font-size:16px">Next step: ID cards</b><div style="color:#1a2c6b;font-size:14px"><b class="tnum">314</b> of these people punch by QR card and have no card yet. They are pre-selected.<br><span style="color:var(--muted-foreground)"><b class="tnum">38</b> punch by face and are left out.</span></div></div>' +
      '<button class="btn btn-primary btn-lg">' + D.icon("id-card", 18) + "Issue and print cards for these 314 employees</button></div>";
  }

  function resultCard() {
    const isCh = D.role === "ch";
    if (isCh) {
      return '<section class="card anim-fade-up"><div class="card-pad" style="padding:48px 24px;text-align:center"><div class="done-ring dr-info">' + D.icon("hourglass") + '</div><h2 style="margin:0 0 6px;font-size:24px">Sent for approval</h2><p style="margin:0 auto 6px;font-size:16px;max-width:52ch"><b class="tnum">352</b> employees are waiting for the Super Admin.</p><p class="muted" style="margin:0 auto 18px;max-width:56ch">Nobody is added until the Super Admin approves. After that, the Super Admin issues and prints the QR cards. You cannot issue cards.</p>' +
        '<div class="ro-banner" role="note" style="max-width:560px;margin:0 auto 22px;text-align:left">' + D.icon("lock", 18) + "<span>Only the Super Admin issues and prints QR cards.</span></div>" +
        '<div class="flex justify-center gap-2 flex-wrap"><a class="btn btn-primary btn-lg" href="#">' + D.icon("send", 18) + 'Open My requests</a><a class="btn btn-outline btn-lg" href="#">Back to employees</a></div></div></section>';
    }
    const perm = noQr ? 38 : 38, temp = noQr ? 0 : 314;
    const title = approved
      ? '<div class="done-ring dr-success">' + D.icon("check") + '</div><div class="badge badge-success" style="margin-bottom:10px">' + D.icon("circle-check") + 'Approved by you</div><h2 style="margin:0 0 6px;font-size:24px"><span class="tnum">' + (noQr ? 38 : 352) + '</span> employees created</h2><p class="muted" style="margin:0 auto 20px;max-width:58ch">Import request from Vikram Deshmukh (Corporate Head) of 19/10/2026, file <span class="code">new-workers-oct.xlsx</span>. You approved it on 20/10/2026 at 14:30. One audit entry was written for each person.</p>'
      : '<div class="done-ring dr-success">' + D.icon("check") + '</div><h2 style="margin:0 0 6px;font-size:24px"><span class="tnum">' + (noQr ? 38 : 352) + '</span> created</h2><p class="muted" style="margin:0 auto 20px;max-width:52ch">All ' + (noQr ? 38 : 352) + ' people are now in Upasthiti. One audit entry was written for the import and one for each person.</p>';
    const links = approved
      ? '<div class="flex justify-center gap-2 flex-wrap" style="margin-top:22px"><a class="btn btn-outline btn-lg" href="#">' + D.icon("inbox", 18) + 'Back to approvals</a><a class="btn btn-outline btn-lg" href="#">' + D.icon("users", 18) + "View the employees</a></div>"
      : '<div class="flex justify-center gap-2 flex-wrap" style="margin-top:22px"><a class="btn btn-outline btn-lg" href="#">' + D.icon("users", 18) + 'View the employees</a><a class="btn btn-outline btn-lg" href="#">' + D.icon("file-spreadsheet", 18) + "Import another file</a></div>";
    if (issued) {
      return '<section class="card anim-fade-up"><div class="card-pad" style="padding:44px 24px;text-align:center"><div class="done-ring dr-success">' + D.icon("id-card") + '</div><h2 style="margin:0 0 6px;font-size:24px"><span class="tnum">314</span> cards issued</h2><p class="muted" style="margin:0 auto 20px;max-width:58ch">Valid until <span class="tnum">19/04/2027</span>. <b class="tnum">38</b> face employees got no card. Print the cards now: one print can have at most 200 cards, so the list is split in two parts.</p>' +
        '<div style="display:grid;gap:10px;max-width:560px;margin:0 auto 20px">' +
        '<div class="print-part"><span class="dlg-icon di-primary">' + D.icon("printer") + '</span><div style="flex:1"><b>Part 1: cards 1 to 200</b><div class="muted" style="font-size:13.5px">20 A4 sheets, K134 to PC2</div></div><button class="btn btn-primary btn-lg">' + D.icon("external-link", 18) + 'Open PDF</button></div>' +
        '<div class="print-part"><span class="dlg-icon di-primary">' + D.icon("printer") + '</span><div style="flex:1"><b>Part 2: cards 201 to 314</b><div class="muted" style="font-size:13.5px">12 A4 sheets, SPI to TP2</div></div><button class="btn btn-outline btn-lg">' + D.icon("external-link", 18) + 'Open PDF</button></div></div>' +
        '<p class="muted" style="margin:0 0 20px;font-size:13px">' + D.icon("info", 14, "vertical-align:-2px") + " Each PDF opens in a new tab. You can print later from the QR cards page: filter by Not printed.</p>" +
        '<div class="flex justify-center gap-2 flex-wrap"><a class="btn btn-outline btn-lg" href="01-qr-cards.html">' + D.icon("qr-code", 18) + 'Go to QR cards</a><a class="btn btn-ghost btn-lg" href="#">Done</a></div></div></section>';
    }
    return '<section class="card anim-fade-up"><div class="card-pad" style="padding:44px 24px 28px;text-align:center">' + title + chips(perm, temp) + '<div style="max-width:900px;margin:0 auto">' + nextStep() + "</div>" + links + "</div></section>";
  }

  window.onMockState = function () {
    D.patchShell();
    if (approved) {
      const side = document.getElementById("sidebar");
      side.querySelectorAll(".sb-item[aria-current]").forEach(function (el) { el.removeAttribute("aria-current"); });
      side.querySelector('.sb-item[title="Approvals"]').setAttribute("aria-current", "page");
    }
    const crumbs = D.crumb(approved ? [{ text: "Approvals", href: "#" }, { text: "Import request" }] : [{ text: "Import", href: "#" }, { text: "Result" }]);
    document.getElementById("page").innerHTML = D.pageHead({ crumbs: crumbs, title: approved ? "Import request approved" : "Import employees", desc: approved ? "" : "Step 3 of 3: result." }) + resultCard();

    if (D.has("confirm")) {
      D.mount(D.dialog({
        icon: "id-card", title: "Issue cards to 314 employees", desc: "From the import of 20/10/2026. All of them punch by QR card and have no card yet.", width: 620,
        body: '<div class="space-y-4"><div class="grid gap-3" style="grid-template-columns:1fr 1fr"><div class="result-tile rt-ok"><span class="done-ring" style="width:46px;height:46px;margin:0;background:#fff;color:var(--success)">' + D.icon("circle-check") + '</span><div><b class="big tnum">314</b><span>will get a new card</span></div></div>' +
          '<div class="result-tile rt-neutral"><span class="done-ring" style="width:46px;height:46px;margin:0;background:var(--muted);color:var(--muted-foreground)">' + D.icon("skip-forward") + '</span><div><b class="big tnum">38</b><span>skipped: punch by face</span></div></div></div>' +
          '<div class="form-grid">' + D.field({ id: "iv", label: "Valid until", req: true, control: '<input id="iv" class="input tnum" value="19/04/2027" />', help: "Valid from today. Default: 6 months." }) +
          D.field({ id: "ir", label: "Reason", req: true, control: '<textarea id="ir" class="input textarea" style="min-height:72px">Import of 20/10/2026, new workers.</textarea>', help: "Saved in the audit log." }) + "</div>" +
          '<div class="field-hint">' + D.icon("info") + "<span>After issuing you can print the cards, in parts of at most 200. Cards can be printed later too.</span></div></div>",
        foot: '<button class="btn btn-outline btn-lg">Cancel</button><button class="btn btn-primary btn-lg">' + D.icon("id-card", 18) + "Issue 314 cards</button>",
      }));
    }
    const titles = { approved: "request approved", confirm: "confirm issuing", issued: "follow-up: cards issued", "corporate-head": "sent for approval", "no-qr": "face employees only", done: "import done" };
    const key = Object.keys(titles).filter(D.has)[0];
    M2.tagTitle(titles[key || "done"]);
  };
</script>
</body>
</html>
