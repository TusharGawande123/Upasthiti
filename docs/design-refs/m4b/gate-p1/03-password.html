<!doctype html>
<!--
  Upasthiti - M4b design gate P1 - Screen 3: Set your password /phone/setup/password (spec 4.6, 7 rule 5 proof token 5 minutes, rule 6 password rules, 9 errors).
  States (URL hash): default · typing-weak · typing-ok · mismatch · shown · saving · too-weak · proof-expired · punch-off · too-many-requests
  MOCKUP ONLY. The rule list ticks while typing: every rule shows a tick/circle icon AND the word "Done" / "Not yet" (never colour alone).
-->
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phone attendance: set your password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="p1.css" />
</head>
<body>
<div id="root"></div>
<div class="state-tag" id="state-tag"></div>
<script src="p1.js"></script>
<script>
  const T = {
    weak: "Use at least 8 characters, not only numbers, and not your employee code.",
    expired: "This check has expired. Please check again.",
    off: "Phone attendance is switched off for you. Please visit the plant office.",
    many: "Too many tries right now. Please wait a minute and try again.",
    mismatch: "The two passwords are not the same. Please type it again.",
  };
  const steps = `<div class="steps" aria-label="Step 2 of 2"><span class="stp done"><span class="n">${ic("check")}</span>Check</span><span class="stp on"><span class="n">2</span>Password</span></div>`;
  /* rules: [text, state] state ok | todo | bad */
  const rule = (txt, st) => `<li class="${st === "todo" ? "" : st}"><span class="rk">${st === "ok" ? ic("check") : st === "bad" ? ic("x") : ""}</span><span>${txt}</span><span class="st">${st === "ok" ? "Done" : st === "bad" ? "Not yet" : ""}</span></li>`;
  const rules = (a, b, c, d) => `<div><p class="label" style="font-size:18px;font-weight:650;margin:0 0 4px">Your password needs</p><ul class="rules" aria-live="polite">
    ${rule("8 to 128 characters", a)}${rule("More than numbers only", b)}${rule("Not your employee code", c)}${rule("Not an easy password like 123", d)}</ul></div>`;

  function form(o) {
    o = o || {};
    const dis = !!o.busy;
    const type = o.shown ? "text" : "password";
    return `<form class="pc stack-lg anim-fade-up" onsubmit="return false" novalidate>
      <div class="stack">
        ${P.field("pw1", "New password", o.pw1 || "", { type, eye: true, shown: o.shown, auto: "new-password", disabled: dis, err: o.err1 })}
        ${P.field("pw2", "Type it again", o.pw2 || "", { type, eye: true, shown: o.shown, auto: "new-password", disabled: dis, err: o.err2 })}
      </div>
      ${o.rules || rules("todo", "todo", "todo", "todo")}
      ${o.busy ? P.btn("primary", "", "Saving…", { busy: true }) : P.btn("primary", "save", "Save and sign in", { disabled: o.off })}
    </form>`;
  }
  const passed = `<div class="msg msg-success anim-fade-up" role="status">${ic("circle-check")}<div><span class="mt">Check passed, Sunita</span><span class="mb">Now choose a password. You will use it to sign in.</span></div></div>`;
  const head = P.head("Set your password");
  const timer = `<p class="fine" style="text-align:center">${"This check is valid for 5 minutes."}</p>`;

  function render(s) {
    switch (s) {
      case "typing-weak":
        return steps + head + passed + form({ pw1: "12345", pw2: "", rules: rules("bad", "bad", "ok", "bad") }) + timer;
      case "typing-ok":
        return steps + head + passed + form({ pw1: "Waluj#2026", pw2: "Waluj#2026", rules: rules("ok", "ok", "ok", "ok") }) + timer;
      case "mismatch":
        return steps + head + passed + form({ pw1: "Waluj#2026", pw2: "Waluj#2025", err2: T.mismatch, rules: rules("ok", "ok", "ok", "ok") }) + timer;
      case "shown":
        return steps + head + passed + form({ pw1: "Waluj#2026", pw2: "Waluj#2026", shown: true, rules: rules("ok", "ok", "ok", "ok") }) + timer;
      case "saving":
        return steps + head + passed + form({ pw1: "Waluj#2026", pw2: "Waluj#2026", busy: true, rules: rules("ok", "ok", "ok", "ok") });
      case "too-weak":
        return steps + head + passed + form({ pw1: "E0412123", pw2: "E0412123", rules: rules("ok", "ok", "ok", "ok") }) + P.msg("danger", "shield-alert", "", T.weak) + timer;
      case "proof-expired":
        return steps + head + `<div class="pc state-card anim-fade-up" role="alert"><span class="state-ic si-warning">${ic("timer-off")}</span><h2>${T.expired}</h2><div style="width:100%" class="stack">${P.btn("primary", "scan-face", "Check again")}</div></div>`;
      case "punch-off":
        return steps + head + form({ pw1: "Waluj#2026", pw2: "Waluj#2026", rules: rules("ok", "ok", "ok", "ok") }) + P.msg("warning", "smartphone", "", T.off);
      case "too-many-requests":
        return steps + head + passed + form({ pw1: "Waluj#2026", pw2: "Waluj#2026", rules: rules("ok", "ok", "ok", "ok") }) + P.msg("warning", "hourglass", "", T.many);
      default:
        return steps + head + passed + form({}) + timer;
    }
  }
  P.start({ user: null, split: true, render });
</script>
</body>
</html>
